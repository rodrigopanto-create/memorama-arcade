<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <meta name="description" content="Memorama arcade: encuentra las parejas y supera tu puntaje.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Memorama Arcade</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./gl.js" defer></script>
  <script src="./highscores.js" defer></script>
  <script src="./app.js" type="module"></script>
</head>
<body>
  <header>
    <button id="install" hidden>Instalar</button>
    <button id="update" hidden>Actualizar juego</button>
  </header>
  <main>
    <p id="status" role="status">Cargando el juego...</p>
    <canvas id="glcanvas" tabindex="0" width="400" height="800" aria-label="Memorama. Toca o haz clic para jugar. Toca las letras y Guardar para registrar tus iniciales."></canvas>
    <p id="offline" class="visually-hidden" role="status">Preparando modo sin conexion...</p>
    <p id="storage" role="alert"></p>
    <noscript>Necesitas activar JavaScript para jugar.</noscript>
  </main>
</body>
</html>
